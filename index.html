<!DOCTYPE html>
<html lang="zh-CN" data-theme="parchment">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外资律所并购与资本市场入门学习手册 | 章节精读与笔记工作台</title>
  
  <!-- Meta tags for GitHub Pages -->
  <meta name="description" content="外资律所并购与资本市场入门学习手册，中国法非诉 M&A、PE/FDI、跨境借款外债、股票质押、SPA与英文面试真题解析，支持按章节阅读与随堂笔记。">
  <meta name="author" content="管贝嘉 (Beijia Guan)">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

  <!-- Mermaid.js for Flowcharts and Mindmaps -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      securityLevel: 'loose',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
    });
  </script>

  <!-- Prism.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-coy.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-yellow-200 selection:text-slate-900">

  <!-- Top Navigation Header -->
  <header id="header-nav" class="sticky top-0 z-40 w-full border-b border-slate-200/80 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-4">
      
      <!-- Brand & Mobile Toggle -->
      <div class="flex items-center gap-3">
        <button id="toggle-mobile-sidebar" class="md:hidden p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none" title="打开章节目录">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex items-center gap-2">
          <span class="flex items-center justify-center w-7 h-7 rounded bg-blue-900 text-white font-bold text-sm tracking-wider">M&A</span>
          <div>
            <h1 class="text-sm font-bold text-slate-900 dark:text-white leading-none">外资律所并购与资本市场学习手册</h1>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 hidden sm:block">中国法非诉交易 · 跨境并购 · 英文笔试技术面试真题</p>
          </div>
        </div>
      </div>

      <!-- Center / Search Trigger -->
      <button class="open-search-modal hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 text-xs hover:border-slate-300 dark:hover:border-slate-600 transition-colors w-64 justify-between">
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          搜索 14 门课要点与法条...
        </span>
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-white dark:bg-slate-700 rounded border border-slate-200 dark:border-slate-600 shadow-sm">⌘K</kbd>
      </button>

      <!-- Right Actions: Notes, Themes, Font Size -->
      <div class="flex items-center gap-2">
        
        <!-- Search icon for mobile -->
        <button class="open-search-modal sm:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" title="搜索">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>

        <!-- Font Size Selector -->
        <select id="font-size-select" class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-md px-2 py-1 text-slate-700 dark:text-slate-300 focus:ring-1 focus:ring-blue-600 cursor-pointer" title="调整阅读字号">
          <option value="small">小字号</option>
          <option value="normal" selected>默认字号</option>
          <option value="large">舒适大字</option>
          <option value="xlarge">超大号</option>
        </select>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 text-sm flex items-center gap-1" title="切换阅读主题（羊皮纸/浅色/暗色）">
          <span id="theme-icon">📜</span>
        </button>

        <!-- Notes Drawer Toggle -->
        <button class="toggle-note-drawer flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-blue-900 hover:bg-blue-800 text-white text-xs font-medium shadow-sm transition-all" title="打开/折叠随堂笔记">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          <span class="hidden sm:inline">随堂笔记</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex w-full max-w-7xl mx-auto">
    
    <!-- Left Navigation Sidebar -->
    <aside id="sidebar" class="fixed md:sticky top-14 left-0 z-30 h-[calc(100vh-3.5rem)] w-72 md:w-80 flex-shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
      
      <!-- Progress Bar Card -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="font-medium text-slate-700 dark:text-slate-300">学习进度</span>
          <span id="progress-text" class="text-slate-500 font-mono text-[11px]">已学 0/14 课 (0%)</span>
        </div>
        <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-blue-800 dark:bg-sky-500 transition-all duration-300 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- Chapters List -->
      <div class="flex-1 overflow-y-auto p-3">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">课程目录清单</div>
        <ul id="chapter-list" class="space-y-1">
          <!-- Dynamically populated by app.js -->
        </ul>
      </div>

      <!-- Sidebar Footer -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400 flex items-center justify-between">
        <span>支持离线缓存与本地存储</span>
        <button id="btn-export-notes-md" class="text-blue-800 dark:text-sky-400 hover:underline flex items-center gap-1 font-medium">
          📥 导出笔记
        </button>
      </div>
    </aside>

    <!-- Center Content Reading Area -->
    <main id="main-content" class="flex-1 min-w-0 px-4 sm:px-8 py-8 flex flex-col justify-between">
      
      <div class="max-w-3xl mx-auto w-full">
        
        <!-- Chapter Header Badge & Title -->
        <div class="mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <span id="chapter-desc" class="text-xs font-semibold uppercase tracking-wider text-blue-800 dark:text-sky-400 bg-blue-50 dark:bg-sky-950/60 px-2.5 py-0.5 rounded-full border border-blue-200 dark:border-sky-800"></span>
            <div id="chapter-meta" class="text-xs text-slate-400 flex items-center gap-3"></div>
          </div>
          <h1 id="chapter-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight"></h1>
        </div>

        <!-- In-page Outline / TOC Widget (collapsible) -->
        <div class="mb-8 p-3.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            本课快速导航
          </div>
          <div id="toc-container"></div>
        </div>

        <!-- Rendered Markdown Body -->
        <article id="content-area" class="markdown-body transition-all"></article>

        <!-- Chapter Completion & Linear Nav Footer -->
        <div id="chapter-nav-buttons" class="mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
          <button id="prev-chapter-btn" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
            ← 上一课
          </button>
          
          <button id="mark-complete-btn" class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-blue-800 hover:bg-blue-700 text-white text-xs font-medium shadow-sm transition-all flex items-center justify-center gap-1.5">
            标记本课已完成并继续
          </button>

          <button id="next-chapter-btn" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
            下一课 →
          </button>
        </div>

      </div>

      <!-- Footer Info -->
      <footer class="mt-16 text-center text-xs text-slate-400 py-6 border-t border-slate-200/60 dark:border-slate-800">
        <p>外资律所并购与资本市场学习手册 · 网页与章节笔记系统</p>
        <p class="mt-1">基于 GitHub Pages 零配置静态部署 · 本地数据私密存储（LocalStorage）</p>
      </footer>
    </main>

    <!-- Right Sliding Note Drawer -->
    <aside id="note-drawer" class="fixed top-14 right-0 z-30 h-[calc(100vh-3.5rem)] w-full sm:w-96 md:w-[420px] bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col translate-x-full transition-transform duration-200 ease-in-out">
      
      <!-- Drawer Header -->
      <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/60">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-slate-800 dark:text-white flex items-center gap-1">
            📝 随堂笔记
          </span>
          <span id="note-char-count" class="text-[10px] font-mono text-slate-400 px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700">0 字</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="toggle-note-drawer p-1 rounded-md text-slate-400 hover:text-slate-700 dark:hover:text-white" title="收起笔记面板">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>

      <!-- Quick Template Snippet Pills -->
      <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap gap-1.5 bg-white dark:bg-slate-900 text-[11px]">
        <button data-snippet="points" class="px-2 py-0.5 rounded border border-amber-300 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 hover:bg-amber-100 transition-colors">+ 考点速记</button>
        <button data-snippet="law" class="px-2 py-0.5 rounded border border-blue-300 bg-blue-50 dark:bg-blue-950/40 text-blue-800 dark:text-blue-300 hover:bg-blue-100 transition-colors">+ 待查法规</button>
        <button data-snippet="en" class="px-2 py-0.5 rounded border border-emerald-300 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-100 transition-colors">+ 英文句式</button>
        <button data-snippet="interview" class="px-2 py-0.5 rounded border border-purple-300 bg-purple-50 dark:bg-purple-950/40 text-purple-800 dark:text-purple-300 hover:bg-purple-100 transition-colors">+ 面试答题卡</button>
      </div>

      <!-- Editor Tabs: Edit vs Preview -->
      <div class="flex border-b border-slate-200 dark:border-slate-800 px-4 text-xs font-medium">
        <button id="tab-edit-note" class="py-2 border-b-2 border-blue-700 text-blue-700 dark:text-sky-400 font-semibold px-2">编辑笔记</button>
        <button id="tab-preview-note" class="py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 px-2">效果预览</button>
      </div>

      <!-- Note Editor Body -->
      <div class="flex-1 p-4 flex flex-col min-h-0 bg-amber-50/20 dark:bg-slate-900">
        <textarea id="note-textarea" 
          placeholder="在此输入本课学习笔记、案例拆解或答题提纲（支持 Markdown 语法）...&#10;&#10;💡 小提示：在正文中划选任意文字，即可点击浮动按钮一键摘录到此处！"
          class="flex-1 w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-sm focus:ring-1 focus:ring-blue-600 focus:outline-none resize-none font-mono leading-relaxed"></textarea>

        <div id="note-preview" class="flex-1 w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 overflow-y-auto text-sm markdown-body hidden"></div>
      </div>

      <!-- Drawer Footer -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/60">
        <span id="note-status" class="truncate">✓ 已自动保存到本地</span>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button id="btn-export-notes-json" class="hover:underline text-slate-600 dark:text-slate-300" title="备份全部笔记数据">备份JSON</button>
          <span>|</span>
          <button id="btn-import-notes-json" class="hover:underline text-slate-600 dark:text-slate-300" title="从JSON文件恢复">恢复</button>
        </div>
      </div>
    </aside>

  </div>

  <!-- Text Selection Floating Tooltip (📌 摘录到本课笔记) -->
  <div id="selection-tooltip">
    📌 摘录到本课笔记
  </div>

  <!-- Global Search Modal (Ctrl/Cmd + K) -->
  <div id="search-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden items-start justify-center pt-16 px-4">
    <div class="bg-white dark:bg-slate-900 rounded-xl max-w-xl w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
      
      <!-- Search Input Box -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input id="search-input" type="text" placeholder="全局搜索课程知识点、法条或法考/外所题点..." class="w-full bg-transparent text-sm text-slate-900 dark:text-white focus:outline-none placeholder-slate-400">
        <button id="close-search-modal" class="text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">ESC</button>
      </div>

      <!-- Search Results Area -->
      <div id="search-results" class="p-3 overflow-y-auto space-y-2 flex-1">
        <!-- Dynamically injected -->
      </div>
    </div>
  </div>

  <!-- Chapters Pre-bundled Dataset and App Engine -->
  <script src="assets/chapters.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
